<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Glow Button</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --btn-body: #23272e;
            --anim-speed-slow: 4s;
            --anim-speed-fast: 1.5s;
        }

        body {
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 1. THE OUTER WRAPPER (The Clipping Mask) */
        .ai-btn-container {
            position: relative;
            width: 180px;
            height: 40px;
            padding: 1px; /* This creates the border thickness */
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Crucial: clips the rotating square */
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* 2. THE ROTATING GRADIENT (The "Border" Engine) */
        .ai-btn-container::before {
            content: "";
            position: absolute;
            /* Must be much larger than the button to ensure rotation coverage */
            width: 300px; 
            height: 300px;
            background: conic-gradient(
                rgba(66, 133, 244, 0) 0deg,
                #4285f4 40deg,
                #34a853 120deg,
                #fbbc05 200deg,
                #ea4335 280deg,
                rgba(66, 133, 244, 0) 360deg
            );
            animation: rotate-clockwise var(--anim-speed-slow) linear infinite;
        }

        /* 3. REVERSE ROTATION ON HOVER */
        .ai-btn-container:hover::before {
            animation: rotate-counter-clockwise var(--anim-speed-fast) linear infinite;
        }

        /* 4. THE INNER BUTTON FACE */
        .ai-btn-content {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            background: var(--btn-body);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
            user-select: none;
        }

        /* Subtle Inner Shadow for Depth */
        .ai-btn-content::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 26px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 
                        inset 0 -2px 4px rgba(0,0,0,0.2);
        }

        /* Icon Styling */
        .ai-icon {
            width: 20px;
            height: 20px;
            fill: #e8eaed;
        }

        /* KEYFRAMES */
        @keyframes rotate-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-counter-clockwise {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Interaction Scale */
        .ai-btn-container:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="ai-btn-container">
        <div class="ai-btn-content">
            <!-- Sparkle/Search Icon -->
            <svg class="ai-icon" viewBox="0 0 24 24">
                <path d="M19,9L17.5,12.5L14,14L17.5,15.5L19,19L20.5,15.5L24,14L20.5,12.5L19,9M9,4L6.5,9.5L1,12L6.5,14.5L9,20L11.5,14.5L17,12L11.5,9.5L9,4Z" />
            </svg>
            AI Mode
        </div>
    </div>

</body>
</html>
